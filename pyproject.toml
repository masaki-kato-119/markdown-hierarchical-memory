[project]
name = "mdmem"
version = "0.1.0"
description = "Markdown Hierarchical Memory MCP server (implements markdown-hierarchical-memory-spec.md v1)"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.20.0",
    "pyyaml>=6.0",
]

[project.scripts]
mdmem-server = "mdmem.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
